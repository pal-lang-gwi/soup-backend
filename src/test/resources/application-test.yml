spring:
  application:
    name: soup
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test
            client-secret: test
            scope:
              - email
              - profile
          kakao:
            client-id: test
            client-secret: test
            client-authentication-method: client_secret_post
            redirect-uri: http://localhost:8080/login/oauth2/code/kakao
            authorization-grant-type: authorization_code
            client-name: kakao
            scope:
              - profile_nickname
              - profile_image
              - account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

security:
  jwt:
    access-token:
      ttl: 3600
    refresh-token:
      ttl: 1209600

jwt:
  issuer: test
  client-secret: test

front:
  domain: http://localhost:5173

openai:
  api:
    url: https://api.openai.com/v1
    key: test
  model: test-model

logging:
  level:
    root: INFO
    com.palangwi.soup: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false
    redis:
      enabled: true
    db:
      enabled: true
    mongo:
      enabled: false
