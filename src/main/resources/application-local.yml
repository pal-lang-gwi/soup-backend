spring:
  config:
    activate:
      on-profile: local

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/soupdb}
    username: ${POSTGRES_USERNAME:soup}
    password: ${POSTGRES_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update

  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://soup_mongo:password@localhost:27017/soupdb?authSource=admin}

    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
            scope:
              - email
              - profile

          kakao:
            client-id: ${KAKAO_CLIENT_ID:}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/login/oauth2/code/kakao}
            authorization-grant-type: authorization_code
            client-name: kakao
            scope:
              - profile_nickname
              - profile_image
              - account_email

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  issuer: ${JWT_ISSUER:soup-local}
  client-secret: ${JWT_SECRET:local-secret}

front:
  domain: ${FRONT_DOMAIN:http://localhost:3000}

app:
  api:
    domain: ${API_DOMAIN:http://localhost:8080/api/v1}

perplexity:
  api-key: ${PERPLEXITY_API_KEY:}
  model: ${PERPLEXITY_MODEL:sonar}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:text-embedding-3-small}

cloud:
  aws:
    sqs:
      queue-type: ${AWS_SQS_QUEUE_TYPE:standard}
      queue-name: ${AWS_SQS_QUEUE_NAME:Soup-Queue}
