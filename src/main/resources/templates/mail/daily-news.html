<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>오늘의 뉴스 요약</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f4f4; font-family: Arial, sans-serif;">
  <div style="max-width: 640px; margin: 30px auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
    
    <!-- 헤더 영역 -->
      <div style="background-color: #00b894; padding: 40px 30px; text-align: center;">
          <h1 style="color: #ffffff; font-size: 24px; margin: 0;">📰 오늘의 키워드 뉴스</h1>
          <p style="color: #dfe6e9; font-size: 16px; margin: 10px 0 0;" th:text="'안녕하세요, ' + ${name} + '님!'">
              안녕하세요, 사용자님!
          </p>
      </div>

      <!-- 본문 뉴스 요약 카드 -->
    <div style="padding: 30px;">
      <div th:each="summary : ${summaries}" style="margin-bottom: 24px; padding: 20px; border: 1px solid #e0e0e0; border-radius: 8px; background-color: #fafafa;">
        <div style="font-size: 16px; font-weight: bold; color: #2c3e50; margin-bottom: 8px;" th:text="${summary.keywordName}">키워드</div>
        <div style="font-size: 14px; color: #555555; line-height: 1.5;" th:utext="${summary.shortSummary}">요약 내용</div>
        <a th:href="@{'https://soupspoon.kr/news'(keyword=${summary.keywordName}, date=${summary.createdDate})}"
           style="
             display: inline-block;
             margin-top: 16px;
             padding: 12px 24px;
             background-color: #1abc9c;
             color: #ffffff;
             font-size: 14px;
             font-weight: 600;
             text-decoration: none;
             border-radius: 50px;
           ">
          🔍 자세히 보기
        </a>
      </div>
    </div>

    <!-- 푸터 영역 -->
    <div style="text-align: center; padding: 20px; font-size: 12px; color: #aaaaaa;">
      <p style="margin: 0;">뉴스 요약 서비스 Soup</p>
      <img th:src="@{${trackingUrl}}" width="1" height="1" style="display:none;" alt="tracking-pixel"/>
    </div>
  </div>
</body>
</html>
