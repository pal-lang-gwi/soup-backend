<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>오늘의 뉴스 요약</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f6f6f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 640px;
            margin: auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
        }
        .title {
            font-size: 24px;
            font-weight: bold;
            color: #333333;
            margin-bottom: 10px;
        }
        .greeting {
            font-size: 18px;
            margin-bottom: 20px;
        }
        .summary-card {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #dddddd;
            border-radius: 8px;
            background-color: #fafafa;
        }
        .summary-keyword {
            font-size: 16px;
            font-weight: bold;
            color: #2c3e50;
        }
        .summary-content {
            font-size: 14px;
            color: #555555;
            margin-top: 5px;
        }
        .read-more-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 12px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 13px;
        }
        .footer {
            font-size: 12px;
            color: #aaaaaa;
            margin-top: 30px;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="title">📰 오늘의 키워드 뉴스 요약</div>
    <div class="greeting" th:text="'안녕하세요, ' + ${name} + '님!'"></div>

    <div th:each="summary : ${summaries}" class="summary-card">
        <div class="summary-keyword" th:text="${summary.keyword}">키워드</div>
        <div class="summary-content" th:text="${summary.shortSummary}">요약 내용</div>
        <a th:href="@{'https://soupspoon.kr/news'(keyword=${summary.keyword}, date=${summary.createdDate})}" class="read-more-btn">
            자세히 보기 →
        </a>
    </div>

    <div class="footer">
        <img th:src="@{${trackingUrl}}" width="1" height="1" style="display:none;" alt=""/>
    </div>
</div>
</body>
</html>
