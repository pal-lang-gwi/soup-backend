name: Java CI with Gradle

on:
  pull_request:
    branches: ["develop"]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    env:
      SPRING_PROFILES_ACTIVE: test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      RABBITMQ_HOST: localhost
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      GOOGLE_CLIENT_ID: dummy
      GOOGLE_CLIENT_SECRET: dummy
      KAKAO_CLIENT_ID: dummy
      KAKAO_CLIENT_SECRET: dummy
      KAKAO_REDIRECT_URI: http://localhost:8080/login/oauth2/code/kakao
      JWT_ACCESS_TOKEN_TTL: 3600
      JWT_REFRESH_TOKEN_TTL: 1209600
      JWT_ISSUER: test
      JWT_CLIENT_SECRET: test
      FRONT_DOMAIN: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Create application-test.yml
        run: |
          mkdir -p ./src/main/resources
          cat << EOF > ./src/main/resources/application-test.yml
          spring:
            datasource:
              url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
              username: sa
              password:
              driver-class-name: org.h2.Driver
            jpa:
              hibernate:
                ddl-auto: create-drop
              show-sql: true
              properties:
                hibernate:
                  format_sql: true
                  dialect: org.hibernate.dialect.H2Dialect
            h2:
              console:
                enabled: true
                path: /h2-console
          EOF

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload build reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: build/reports/
