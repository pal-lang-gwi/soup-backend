name: Java CI with Gradle

on:
  pull_request:
    branches: ["develop"]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    env:
      SPRING_PROFILES_ACTIVE: test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      RABBITMQ_HOST: localhost
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      GOOGLE_CLIENT_ID: dummy
      GOOGLE_CLIENT_SECRET: dummy
      KAKAO_CLIENT_ID: dummy
      KAKAO_CLIENT_SECRET: dummy
      KAKAO_REDIRECT_URI: http://localhost:8080/login/oauth2/code/kakao
      JWT_ACCESS_TOKEN_TTL: 3600
      JWT_REFRESH_TOKEN_TTL: 1209600
      JWT_ISSUER: test
      JWT_CLIENT_SECRET: test
      FRONT_DOMAIN: http://localhost:5173
      SERVER_DOMAIN: https://soupspoon.kr/api/v1
      MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Create application-test.yml
        run: |
          mkdir -p ./src/main/resources
          cat << EOF > ./src/main/resources/application-test.yml
          spring:
            application:
              name: soup
            security:
              oauth2:
                client:
                  registration:
                    google:
                      client-id: test
                      client-secret: test
                      scope:
                        - email
                        - profile
                    kakao:
                      client-id: test
                      client-secret: test
                      client-authentication-method: client_secret_post
                      redirect-uri: http://localhost:8080/login/oauth2/code/kakao
                      authorization-grant-type: authorization_code
                      client-name: kakao
                      scope:
                        - profile_nickname
                        - profile_image
                        - account_email
                  provider:
                    kakao:
                      authorization-uri: https://kauth.kakao.com/oauth/authorize
                      token-uri: https://kauth.kakao.com/oauth/token
                      user-info-uri: https://kapi.kakao.com/v2/user/me
                      user-name-attribute: id
          security:
            jwt:
              access-token:
                ttl: 3600
              refresh-token:
                ttl: 1209600
          jwt:
            issuer: test
            client-secret: test

          front:
            domain: http://localhost:5173
          server:
            domain: https://soupspoon.kr/api/v1

          openai:
            api:
              url: https://api.openai.com/v1
              key: test
            model: test-model

          logging:
            level:
              root: INFO
              com.palangwi.soup: DEBUG
              org.springframework.security: DEBUG
              org.springframework.web: DEBUG

          management:
            endpoints:
              web:
                exposure:
                  include: "*"
            endpoint:
              health:
                show-details: always
            health:
              redis:
                enabled: true
              db:
                enabled: true
              mongo:
                enabled: false
          EOF

      - name: Build with Gradle
        run: chmod +x ./gradlew && ./gradlew build

      - name: Upload build reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: build/reports/

      - name: Notify Mattermost on Success
        if: success()
        uses: 7c/mattermost-notify@v1
        with:
          webhook-url: ${{ env.MATTERMOST_WEBHOOK_URL }}
          message: "✅ CI 성공: ${{ github.repository }}의 PR #${{ github.event.pull_request.number }} 빌드가 성공했습니다."

      - name: Notify Mattermost on Failure
        if: failure()
        uses: 7c/mattermost-notify@v1
        with:
          webhook-url: ${{ env.MATTERMOST_WEBHOOK_URL }}
          message: "❌ CI 실패: ${{ github.repository }}의 PR #${{ github.event.pull_request.number }} 빌드가 실패했습니다."
