name: Publish Backend Image

on:
  push:
    branches: ["develop"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Test and Publish
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Create application-test.yml from secret
        run: |
          mkdir -p ./src/test/resources
          echo "${{ secrets.APPLICATION_TEST_YML }}" | base64 -d > ./src/test/resources/application-test.yml

      - name: Run tests
        run: |
          chmod +x ./gradlew
          ./gradlew clean test --stacktrace --info -Dspring.profiles.active=test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/soup-backend:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/soup-backend:${{ github.sha }}

      - name: Notify Discord on Publish Success
        if: success() && env.DISCORD_WEBHOOK_URL != ''
        uses: fjogeleit/http-request-action@v1.14.0
        continue-on-error: true
        with:
          url: ${{ env.DISCORD_WEBHOOK_URL }}
          method: "POST"
          customHeaders: '{"Content-Type": "application/json"}'
          data: |
            {
              "embeds": [{
                "title": "📦 이미지 발행 성공",
                "description": "백엔드 Docker 이미지가 Docker Hub에 업로드되었습니다.",
                "fields": [
                  {
                    "name": "Repository",
                    "value": "`${{ github.repository }}`",
                    "inline": true
                  },
                  {
                    "name": "Tag",
                    "value": "`latest`, `${{ github.sha }}`",
                    "inline": true
                  }
                ],
                "color": 3066993
              }]
            }

      - name: Notify Discord on Publish Failure
        if: failure() && env.DISCORD_WEBHOOK_URL != ''
        uses: fjogeleit/http-request-action@v1.14.0
        continue-on-error: true
        with:
          url: ${{ env.DISCORD_WEBHOOK_URL }}
          method: "POST"
          customHeaders: '{"Content-Type": "application/json"}'
          data: |
            {
              "embeds": [{
                "title": "🔥 이미지 발행 실패",
                "description": "백엔드 Docker 이미지 업로드 중 오류가 발생했습니다.",
                "fields": [
                  {
                    "name": "Repository",
                    "value": "`${{ github.repository }}`",
                    "inline": true
                  },
                  {
                    "name": "Commit",
                    "value": "`${{ github.sha }}`",
                    "inline": true
                  }
                ],
                "color": 15158332
              }]
            }
