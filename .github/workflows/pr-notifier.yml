name: PR Notification to Discord
on:
  pull_request:
    types: [opened, reopened, closed]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Send PR opened/reopened notification
        if: env.DISCORD_WEBHOOK_URL != '' && github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'reopened')
        uses: fjogeleit/http-request-action@v1.14.0
        continue-on-error: true
        with:
          url: ${{ env.DISCORD_WEBHOOK_URL }}
          method: "POST"
          customHeaders: '{"Content-Type": "application/json"}'
          data: |
            {
              "content": "🔔 New PR **${{ github.event.pull_request.title }}** by `${{ github.actor }}`\n<${{ github.event.pull_request.html_url }}>"
            }

      - name: Send PR review notification
        if: env.DISCORD_WEBHOOK_URL != '' && github.event_name == 'pull_request_review' && github.event.review.state != 'commented'
        uses: fjogeleit/http-request-action@v1.14.0
        continue-on-error: true
        with:
          url: ${{ env.DISCORD_WEBHOOK_URL }}
          method: "POST"
          customHeaders: '{"Content-Type": "application/json"}'
          data: |
            {
              "content": "👀 PR **${{ github.event.pull_request.title }}** was ${{ github.event.review.state }} by `${{ github.actor }}`\n<${{ github.event.pull_request.html_url }}>"
            }

      - name: Send PR merged notification
        if: env.DISCORD_WEBHOOK_URL != '' && github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
        uses: fjogeleit/http-request-action@v1.14.0
        continue-on-error: true
        with:
          url: ${{ env.DISCORD_WEBHOOK_URL }}
          method: "POST"
          customHeaders: '{"Content-Type": "application/json"}'
          data: |
            {
              "content": "✅ PR **${{ github.event.pull_request.title }}** was merged by `${{ github.actor }}`\n<${{ github.event.pull_request.html_url }}>"
            }

      - name: Send PR comment notification (issue comment)
        if: env.DISCORD_WEBHOOK_URL != '' && github.event_name == 'issue_comment' && github.event.issue.pull_request != null
        uses: fjogeleit/http-request-action@v1.14.0
        continue-on-error: true
        with:
          url: ${{ env.DISCORD_WEBHOOK_URL }}
          method: "POST"
          customHeaders: '{"Content-Type": "application/json"}'
          data: |
            {
              "content": "💬 New comment on PR **${{ github.event.issue.title }}** by `${{ github.actor }}`\n<${{ github.event.comment.html_url }}>"
            }

      - name: Send PR comment notification (review comment)
        if: env.DISCORD_WEBHOOK_URL != '' && github.event_name == 'pull_request_review_comment'
        uses: fjogeleit/http-request-action@v1.14.0
        continue-on-error: true
        with:
          url: ${{ env.DISCORD_WEBHOOK_URL }}
          method: "POST"
          customHeaders: '{"Content-Type": "application/json"}'
          data: |
            {
              "content": "💬 New review comment on PR **${{ github.event.pull_request.title }}** by `${{ github.actor }}`\n<${{ github.event.comment.html_url }}>"
            }
