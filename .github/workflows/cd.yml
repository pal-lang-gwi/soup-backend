name: Java CD with Docker

on:
  push:
    branches: ["develop"]

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Create application.yml from secret
        run: |
          mkdir -p ./src/main/resources
          echo "${{ secrets.APPLICATION_YML }}" | base64 -d > ./src/main/resources/application.yml
          echo "${{ secrets.PROMETHEUS_YML }}" | base64 -d > ./src/main/resources/prometheus.yml

      - name: Create news-summary.txt from secret
        run: |
          mkdir -p ./src/main/resources/prompts
          echo "${{ secrets.NEWS_SUMMARY_PROMPT }}" | base64 -d > ./src/main/resources/prompts/news-prompt.txt

      - name: Create application-test.yml for docs generation
        run: |
          mkdir -p ./src/test/resources
          echo "${{ secrets.APPLICATION_TEST_YML }}" | base64 -d > ./src/test/resources/application-test.yml || echo "# Test config placeholder" > ./src/test/resources/application-test.yml

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --info
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false

      - name: Build Docker image
        run: docker build -t soup-backend . --no-cache
        env:
          DOCKER_BUILDKIT: 1

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Push to Docker Hub
        run: |
          docker tag soup-backend ${{ secrets.DOCKER_HUB_USERNAME }}/soup-backend:latest
          docker tag soup-backend ${{ secrets.DOCKER_HUB_USERNAME }}/soup-backend:${{ github.sha }}
          docker rmi soup-backend
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/soup-backend:latest
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/soup-backend:${{ github.sha }}

      - name: Deploy to Home Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOME_HOST }}
          username: ${{ secrets.HOME_USERNAME }}
          key: ${{ secrets.HOME_SSH_KEY }}
          timeout: 60s
          script: |
            set -e
            mkdir -p /home/deploy/app
            cd /home/deploy/app

            if [ -f docker-compose.yml ]; then
              cp docker-compose.yml docker-compose.yml.backup.$(date +%Y%m%d_%H%M%S)
            fi

            echo "${{ secrets.DOCKER_COMPOSE_YML }}" | base64 -d > docker-compose.yml

            echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin
            docker compose down --remove-orphans || true
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/soup-backend:latest
            docker compose up -d
            docker compose ps

      - name: Health Check
        run: |
          for i in {1..30}; do
            if curl -s -f -m 30 "https://api.soupspoon.kr/api/v1/health" > /dev/null; then
              echo "✅ Application is healthy!"
              exit 0
            fi
            sleep 10
          done
          echo "❌ Health check failed after 30 attempts"
          exit 1

      - name: Notify Discord on Success
        if: success()
        uses: fjogeleit/http-request-action@v1.14.0
        with:
          url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          method: "POST"
          customHeaders: |
            Content-Type: application/json
          data: |
            {
              "embeds": [{
                "title": "🚀 배포 성공",
                "description": "홈서버 배포 성공",
                "fields": [
                  { "name": "Repository", "value": "`${{ github.repository }}`", "inline": true },
                  { "name": "Branch", "value": "`${{ github.ref_name }}`", "inline": true },
                  { "name": "Commit", "value": "`${{ github.sha }}`", "inline": true }
                ],
                "color": 3066993,
                "timestamp": "${{ github.event.head_commit.timestamp }}"
              }]
            }

      - name: Notify Discord on Failure
        if: failure()
        uses: fjogeleit/http-request-action@v1.14.0
        with:
          url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          method: "POST"
          customHeaders: |
            Content-Type: application/json
          data: |
            {
              "embeds": [{
                "title": "🔥 배포 실패",
                "description": "홈서버 배포 실패",
                "fields": [
                  { "name": "Repository", "value": "`${{ github.repository }}`", "inline": true },
                  { "name": "Branch", "value": "`${{ github.ref_name }}`", "inline": true },
                  { "name": "Commit", "value": "`${{ github.sha }}`", "inline": true }
                ],
                "color": 15158332,
                "timestamp": "${{ github.event.head_commit.timestamp }}"
              }]
            }
