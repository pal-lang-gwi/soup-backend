name: Java CD with Docker

on:
  push:
    branches: ["develop"]

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Create application.yml from secret
        run: |
          mkdir -p ./src/main/resources
          echo "${{ secrets.APPLICATION_YML }}" | base64 -d > ./src/main/resources/application.yml

      - name: Create news-summary.txt from secret
        run: |
          mkdir -p ./src/main/resources/prompts
          echo "${{ secrets.NEWS_SUMMARY_PROMPT }}" | base64 -d > ./src/main/resources/prompts/news-summary.txt

      - name: Build with Gradle
        run: chmod +x ./gradlew && ./gradlew build -x test

      - name: Build Docker image
        run: docker build -t soup-backend .

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Push to Docker Hub
        run: |
          docker tag soup-backend ${{ secrets.DOCKER_HUB_USERNAME }}/soup-backend:latest
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/soup-backend:latest

      - name: Deploy to EC2
        id: deploy-ec2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu
            echo "${{ secrets.DOCKER_COMPOSE_YML }}" | base64 -d > docker-compose.yml
            sudo docker-compose down

            // 사용하지 않는 컨테이너 및 이미지 정리
            sudo docker image prune -f

            sudo docker-compose up -d

      # 헬스 체크 추가
      - name: Health Check
        id: health-check
        run: |
          echo "Waiting for application to start..."
          for i in {1..30}; do
            if curl -s -f "https://soupspoon.kr/api/v1/health" > /dev/null; then
              echo "Application is healthy!"
              exit 0
            fi
            echo "Attempt $i: Application not ready yet..."
            sleep 10
          done
          echo "Health check failed after 30 attempts"
          exit 1

      - name: Notify Discord on Health Check Success
        if: success() && steps.health-check.conclusion == 'success'
        uses: fjogeleit/http-request-action@v1.14.0
        with:
          url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          method: "POST"
          customHeaders: |
            Content-Type: application/json
          data: |
            {
              "content": "✅ 헬스 체크 성공 - `${{ github.repository }}` 브랜치 `${{ github.ref_name }}`"
            }

      - name: Notify Discord on Health Check Failure
        if: failure() && steps.health-check.conclusion == 'failure'
        uses: fjogeleit/http-request-action@v1.14.0
        with:
          url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          method: "POST"
          customHeaders: |
            Content-Type: application/json
          data: |
            {
              "content": "❌ 헬스 체크 실패 - `${{ github.repository }}` 브랜치 `${{ github.ref_name }}`"
            }

      - name: Notify Discord on Deploy Success
        if: success() && steps.deploy-ec2.conclusion == 'success'
        uses: fjogeleit/http-request-action@v1.14.0
        with:
          url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          method: "POST"
          customHeaders: |
            Content-Type: application/json
          data: |
            {
              "content": "🚀 배포 성공 - `${{ github.repository }}` 브랜치 `${{ github.ref_name }}`"
            }

      - name: Notify Discord on Deploy Failure
        if: failure() && steps.deploy-ec2.conclusion == 'failure'
        uses: fjogeleit/http-request-action@v1.14.0
        with:
          url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          method: "POST"
          customHeaders: |
            Content-Type: application/json
          data: |
            {
              "content": "🔥 배포 실패 - `${{ github.repository }}` 브랜치 `${{ github.ref_name }}`"
            }
