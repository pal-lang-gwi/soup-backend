name: PR Description Generator

on:
  pull_request:
    types: [opened]

jobs:
  generate-pr-description:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v39
        with:
          files: |
            **/*

      - name: Set changed files environment variable
        run: echo "CHANGED_FILES=${{ steps.changed-files.outputs.all_changed_files }}" >> $GITHUB_ENV

      - name: Generate PR description
        run: |
          prompt="다음 PR에 대한 설명을 작성해주세요:
          PR 제목: ${{ github.event.pull_request.title }}
          변경된 파일들: $CHANGED_FILES

          다음 형식으로 작성해주세요:
          1. 변경 사항 요약
          2. 주요 변경 내용
          3. 테스트 방법
          4. 관련 이슈"

          response=$(curl https://api.openai.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d "{
              \"model\": \"gpt-4.1-nano-2025-04-14\",
              \"messages\": [{\"role\": \"user\", \"content\": \"$prompt\"}]
            }")

          description=$(echo "$response" | jq -r '.choices[0].message.content')

          gh pr edit ${{ github.event.pull_request.number }} --body "$description"

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
