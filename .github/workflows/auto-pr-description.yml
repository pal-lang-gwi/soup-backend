name: PR Description Generator

on:
  pull_request:
    types: [opened]

jobs:
  generate-pr-description:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v39
        with:
          files: |
            **/*

      - name: Set changed files environment variable
        run: echo "CHANGED_FILES=${{ steps.changed-files.outputs.all_changed_files }}" >> $GITHUB_ENV

      - name: Generate PR description
        id: gpt
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { Octokit } = require("@octokit/rest");
            const octokit = new Octokit({
              auth: process.env.GITHUB_TOKEN
            });

            // PR 정보 가져오기
            const pr = context.payload.pull_request;
            const changedFiles = process.env.CHANGED_FILES ? process.env.CHANGED_FILES.split('\n') : [];

            // 변경된 파일들의 내용 가져오기
            const fileContents = await Promise.all(
              changedFiles.map(async (file) => {
                try {
                  const response = await octokit.repos.getContent({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    path: file,
                    ref: pr.head.sha
                  });
                  return {
                    path: file,
                    content: Buffer.from(response.data.content, 'base64').toString()
                  };
                } catch (error) {
                  return { path: file, content: null };
                }
              })
            );

            // OpenAI API 호출
            const { Configuration, OpenAIApi } = require("openai");
            const configuration = new Configuration({
              apiKey: process.env.OPENAI_API_KEY,
            });
            const openai = new OpenAIApi(configuration);

            const prompt = `다음 PR에 대한 설명을 작성해주세요:
            PR 제목: ${pr.title}
            변경된 파일들: ${changedFiles.join(', ')}
            변경 내용: ${fileContents.map(f => f.content ? `\n${f.path}:\n${f.content}` : '').join('\n')}

            다음 형식으로 작성해주세요:
            1. 변경 사항 요약
            2. 주요 변경 내용
            3. 테스트 방법
            4. 관련 이슈`;

            const completion = await openai.createChatCompletion({
              model: "gpt-4.1-nano-2025-04-14",
              messages: [{ role: "user", content: prompt }],
            });

            const description = completion.data.choices[0].message.content;

            // PR description 업데이트
            await octokit.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              body: description
            });

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
